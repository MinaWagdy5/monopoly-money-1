<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congratulations!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      /* Classic dark overlay to let the celebratory box pop */
      background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('https://assets.nintendo.com/image/upload/q_auto:best/f_auto/dpr_2.0/store/software/switch/70010000069639/8248e2edec2e8c106a26cb174fd4ae108207cf21ffd6012704f60ef5540cb79c');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #fff;
    }

    .tracker-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.4); /* Subtle gold glow on the shadow */
      width: 100%;
      max-width: 400px;
      color: #333;
      text-align: center;
    }

    h2 { 
      margin-top: 0; 
      color: #E21B22; /* Monopoly Red */
      font-size: 32px; 
      border-bottom: 3px solid #E21B22; 
      padding-bottom: 15px; 
      text-transform: uppercase;
    }
    
    .prize-box {
      background-color: #fffdf5;
      border: 3px dashed #d39e00; /* Gold dashed border */
      border-radius: 8px;
      padding: 30px 15px;
      margin-top: 25px;
    }
    
    .prize-text {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }

    .prize-amount { 
      font-size: 52px; 
      font-weight: bold; 
      color: #28a745; /* Cash Green */
      margin: 0; 
    }

    .instructions {
      margin-top: 25px;
      font-size: 15px;
      color: #666;
      font-style: italic;
    }

    @media (max-width: 768px) {
      body { background-attachment: scroll; background-position: top center; }
    }
  </style>
</head>
<body>

  <div class="tracker-container">
    <h2>🎉 !أنت كسبت 🎉</h2>
    
    <div class="prize-box">
      <div class="prize-text">:مبروووك كسبت معانا</div>
      <div class="prize-amount">1,000</div>
    </div>
    
    <p class="instructions">
      !وريها للبنك و خد فلوسك
    </p>
  </div>

</body>
</html>
